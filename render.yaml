# render.yaml — StreamCraft Render Deployment Blueprint
# Deploy this by connecting your GitHub repo on render.com → New → Blueprint

services:
  - type: web
    name: streamcraft-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore   # Closest to India — lowest latency
    branch: main

    # Health check endpoint
    healthCheckPath: /api/health

    # Environment variables — set YOUTUBE_COOKIES in Render dashboard
    # Render → streamcraft-backend → Environment → Add Environment Variable
    envVars:
      - key: YOUTUBE_COOKIES
        sync: false   # Secret — must be set manually in Render dashboard

      # Optional: add more cookie accounts for rotation
      # - key: YOUTUBE_COOKIES_2
      #   sync: false

      # RECOMMENDED: Set residential proxy or rotating proxy gateway
      # Format: http://user:pass@host:port OR socks5://user:pass@host:port
      # Supports single proxy, rotating gateway, comma-separated list, or PROXY_URL_1, PROXY_URL_2
      - key: PROXY_URL
        sync: false

      # - key: PROXY_URL_1
      #   sync: false
      # - key: PROXY_URL_2
      #   sync: false

      # RECOMMENDED: PO Token (Proof of Origin) — bypasses bot detection on cloud IPs.
      # How to get: https://github.com/yt-dlp/yt-dlp/wiki/PO-Token-Guide
      # - key: PO_TOKEN
      #   sync: false

    # Auto-deploy on every push to main
    autoDeploy: true
